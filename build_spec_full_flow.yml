version: 0.1
component: build
timeoutInSeconds: 6600
runAs: root
shell: bash
steps:
  - type: Command
    timeoutInSeconds: 600
    name: "Creating Generic Artifact"
    command: |
      echo "Hello World" > abc.txt
  - type: Command
    timeoutInSeconds: 600
    name: "Building HelloWorld"
    command: |
      mvn clean install
    onFailure:
      - type: Command
        command: |
          echo "Building HelloWorld failed :("
        timeoutInSeconds: 400
        runAs: root
outputArtifacts:
  - name: ABC
    type: BINARY
    location: abc.txt
  - name: hello_world_jar
    type: BINARY
    location: target/hello-dev-1.0-SNAPSHOT.jar
